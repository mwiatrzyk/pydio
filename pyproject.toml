[project]
name = "PyDIO"
version = "0.5.0-dev"
description = "Lightweight and functional dependency injection library for Python"
authors = [
    { name = "Maciej Wiatrzyk", email = "maciej.wiatrzyk@gmail.com" }
]
license = "MIT"
license-files = ["LICENSE.txt"]
readme = "README.md"
keywords = ["dependency", "injection", "di", "framework", "toolkit", "tool", "library"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = [
    "typing-extensions>=4.16.0",
]

[project.urls]
Homepage = "https://github.com/mwiatrzyk/pydio"
Repository = "https://github.com/mwiatrzyk/pydio"
Documentation = "https://pydio.readthedocs.io"

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "mockify>=0.14.0",
    "mypy>=1.19.1",
    "myst-parser>=3.0.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"

[tool.pytest.ini_options]
asyncio_mode="auto"
