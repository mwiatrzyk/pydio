[project]
name = "PyDIO"
version = "0.4.1"
description = "Lightweight and functional dependency injection library for Python"
authors = [
    "Maciej Wiatrzyk <maciej.wiatrzyk@gmail.com>"
]
license = "MIT"
readme = "README.md"
documentation = "https://pydio.readthedocs.io"
repository = "https://github.com/mwiatrzyk/pydio"
keywords = ["dependency", "injection", "di", "framework", "toolkit", "tool", "library"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "invoke>=3.0.3",
    "mockify>=0.14.0",
    "mypy>=1.19.1",
    "myst-parser>=3.0.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "sphinx>=7.4.7",
    "sphinx-rtd-theme>=3.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.mypy]
python_version = "3.9"
