version: 2.1

commands:
  install-deps:
    parameters:
      ver_major:
        type: integer
      ver_minor:
        type: integer
    steps:
      #- run: pyenv local <<parameters.ver_major>>.<<parameters.ver_minor>>
      - restore_cache:
          name: restore dependency cache
          keys:
            - poetry-py<<parameters.ver_major>><<parameters.ver_minor>>-{{ checksum "uv.lock" }}
      - run: uv python pin <<parameters.ver_major>>.<<parameters.ver_minor>>
      - run: uv sync
      - save_cache:
          name: save dependency cache
          key: poetry-py<<parameters.ver_major>><<parameters.ver_minor>>-{{ checksum "uv.lock" }}
          paths:
            - .venv
  configure-git:
    steps:
      - run: git config user.name "CircleCI"
      - run: git config user.email "noreply@circleci.com"
  push-to-git:
    steps:
      - run: git push --set-upstream origin $CIRCLE_BRANCH
      - run: git push --tags
  publish-coverage:
    steps:
      - run: poetry run inv qa-cov -f0
      - run: curl -Os https://uploader.codecov.io/latest/linux/codecov
      - run: chmod +x codecov
      - run: ./codecov

jobs:
  test:
    docker:
      - image: cimg/python:<<parameters.ver_major>>.<<parameters.ver_minor>>
    parameters:
      ver_minor:
        type: integer
      ver_major:
        type: integer
    steps:
      - checkout
      - install-deps:
          ver_major: <<parameters.ver_major>>
          ver_minor: <<parameters.ver_minor>>
      - run: uv run inv check
  publish-coverage:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - configure-git
      - install-deps:
          ver_major: 3
          ver_minor: 9
      - publish-coverage
  tag:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - configure-git
      - install-deps:
          ver_major: 3
          ver_minor: 9
      - run: uv tool install --python 3.9 bumpify
      - run: bumpify bump
      - push-to-git
  deploy:
    docker:
      - image: cimg/python:3.9
    steps:
      - checkout
      - install-deps:
          ver_major: 3
          ver_minor: 9
      - run: poetry run inv qa
      - run: poetry run inv deploy-prod

workflows:
  test:
    jobs:
      - test:
          name: "test-py39"
          ver_major: 3
          ver_minor: 9
      - test:
          name: "test-py310"
          ver_major: 3
          ver_minor: 10
      - test:
          name: "test-py311"
          ver_major: 3
          ver_minor: 11
      - test:
          name: "test-py312"
          ver_major: 3
          ver_minor: 12
      - test:
          name: "test-py313"
          ver_major: 3
          ver_minor: 13
      - test:
          name: "test-py314"
          ver_major: 3
          ver_minor: 14
      - publish-coverage:
          filters:
            branches:
              only: master
      - tag:
          requires:
            - test-py39
            - test-py310
            - test-py311
            - test-py312
            - test-py313
            - test-py314
          filters:
            branches:
              only: development  #XXX: Change to `master` before merge
      - deploy:
          requires:
            - test-py39
            - test-py310
            - test-py311
            - test-py312
            - test-py313
            - test-py314
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
